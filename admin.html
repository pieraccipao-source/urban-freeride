<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Freeride | Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0b12;color:#f5f1ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px}header img{width:76px}h1{font-size:24px;margin:0}small,p{color:#b4a9c7}a{color:#c99aff} .notice{background:#261a36;border:1px solid #61428a;padding:15px;border-radius:14px;margin:24px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.stat,article{background:linear-gradient(135deg,#21192d,#15121d);border:1px solid #382a4a;border-radius:18px;padding:18px}.stat b{display:block;font-size:32px;color:#d6a4ff}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;color:white;background:#30223f;border:1px solid #65488a;border-radius:10px;padding:10px 14px;cursor:pointer}button:hover,button.active{background:#7735bf}article{margin:12px 0}article img{max-width:100%;max-height:240px;border-radius:12px}article h3{margin:8px 0} .actions{display:flex;gap:8px;flex-wrap:wrap}.approve{background:#174c3b}.reject{background:#65283d}.tag{color:#e2b5ff;font-size:12px}input{background:#17121f;color:white;border:1px solid #59436d;padding:10px;border-radius:8px;width:100%;margin:8px 0} </style><main><header><img src="assets/brand-emblem.png" alt="Urban Freeride"><div><h1>ADMIN CONTROL CENTER</h1><small>URBAN FREERIDE · STUDIO V4</small></div></header><div class="notice"><b>Ambiente dimostrativo locale</b><p>Nessuna autenticazione reale, nessuna analisi AI attiva. Non utilizzare con dati reali di minori. I contenuti sono in attesa fino alla decisione manuale.</p><a href="index.html">← Torna all'app rider</a></div><div class="stats" id="stats"></div><nav id="filters"></nav><div id="queue"></div><h2>Registro decisioni</h2><div id="log"></div></main><script>
const K='uf_review_v4',D='urban_freeride_premium_v1';let filter='Tutti';const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const el=(tag,t,cls)=>{let x=document.createElement(tag);if(t)x.textContent=t;if(cls)x.className=cls;return x};const $=id=>document.getElementById(id);function render(){let q=read(K,[]);$('stats').replaceChildren();for(let [label,n] of [['In attesa',q.filter(x=>x.status==='pending').length],['Approvati',q.filter(x=>x.status==='approved').length],['Bloccati',q.filter(x=>x.status==='rejected').length]]){let a=el('div','','stat');a.append(el('b',String(n)),el('small',label));$('stats').append(a)}$('filters').replaceChildren();for(let f of ['Tutti','Foto','Video','Commento']){let b=el('button',f,f===filter?'active':'');b.onclick=()=>{filter=f;render()};$('filters').append(b)}$('queue').replaceChildren();for(let x of q.filter(x=>filter==='Tutti'||x.type===filter)){let a=el('article');a.append(el('span',x.type+' · '+x.status,'tag'),el('h3',x.author),el('p',x.text));if(x.type==='Foto'&&x.spot?.photo?.startsWith('data:image/')){let im=el('img');im.src=x.spot.photo;a.append(im)}if(x.type==='Video')a.append(el('p','Video non archiviato nella demo: verifica del filmato non disponibile.'));a.append(el('p','AI: non collegata · revisione manuale'));if(x.status==='pending'){let reason=el('input');reason.placeholder='Motivazione della decisione';a.append(reason);let actions=el('div','','actions');for(let [status,label,cls] of [['approved','Approva','approve'],['rejected','Blocca','reject']]){let b=el('button',label,cls);b.onclick=()=>decide(x.id,status,reason.value);if(status==='approved'&&x.type==='Video'){b.disabled=true;b.title='Video non verificabile nella demo'}actions.append(b)}a.append(actions)}$('queue').append(a)}if(!$('queue').children.length)$('queue').append(el('p','Nessun contenuto. Invia una foto o un commento dall’app rider.'));$('log').replaceChildren();for(let x of q.filter(x=>x.status!=='pending'))$('log').append(el('p',x.decided+' · '+x.type+' · '+x.status+' · '+x.reason))}
function decide(id,status,reason){if(!reason.trim()){alert('Inserisci una motivazione');return}let q=read(K,[]),x=q.find(x=>x.id===id);if(!x||x.status!=='pending')return;try{if(status==='approved'){let d=read(D,{});if(x.type==='Commento'){d.comments??={};(d.comments[x.postId]??=[]).push(x.text)}else if(x.type==='Foto'){d.spots??=[];d.posts??=[];if(!d.spots.some(s=>s.id===x.spot.id)){d.spots.unshift(x.spot);d.posts.unshift(x.post)}}else return;write(D,d)}Object.assign(x,{status,reason,decided:new Date().toLocaleString('it-IT')});write(K,q);render()}catch{alert('Salvataggio non riuscito: spazio locale insufficiente')}}window.addEventListener('storage',render);render();</script></html>
